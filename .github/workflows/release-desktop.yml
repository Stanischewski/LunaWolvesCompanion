name: Release Desktop Agent

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release-Tag (z.B. v0.1.1)'
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4

      - name: Monorepo-Dependencies installieren
        run: pnpm install

      - name: App-Version auf Release-Tag setzen
        shell: bash
        run: |
          VERSION="${{ github.event.release.tag_name || inputs.tag_name }}"
          VERSION="${VERSION#v}"
          jq ".version = \"$VERSION\"" apps/desktop/src-tauri/tauri.conf.json > tmp.json
          mv tmp.json apps/desktop/src-tauri/tauri.conf.json

      # Release-Text aus .github/release-notes/<tag>.md, falls hinterlegt.
      # Ohne Datei bleibt ein knapper Standardtext stehen, damit die
      # Release-Seite nicht leer ist.
      - name: Release-Notes einlesen
        id: notes
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag_name }}"
          FILE=".github/release-notes/${TAG}.md"
          {
            echo "body<<RELEASE_NOTES_EOF"
            if [ -f "$FILE" ]; then
              cat "$FILE"
            else
              echo "Desktop-Agent ${TAG}. Installer siehe Assets."
            fi
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Tauri-App bauen und Artifacts hochladen
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.event.release.tag_name || inputs.tag_name }}
          # Ohne releaseName legt tauri-action keinen neuen Release an und
          # bricht mit "Release not found or created" ab. Das fiel nie auf,
          # solange der Release vorher von Hand existierte.
          releaseName: ${{ github.event.release.tag_name || inputs.tag_name }}
          releaseBody: ${{ steps.notes.outputs.body }}

      # Denselben Installer noch einmal unter einem festen Namen anhängen.
      # tauri-action benennt ihn mit Version ("..._0.2.1_x64-setup.exe"), damit
      # gibt es keine Adresse, die dauerhaft auf die neueste Fassung zeigt.
      # Mit festem Namen funktioniert
      #   releases/latest/download/LunaWolvesAgent-Setup.exe
      # als Ein-Klick-Link, der in der README stehen bleiben kann.
      #
      # Die versionierten Dateien bleiben erhalten — der Tauri-Updater
      # verweist aus latest.json auf genau sie.
      - name: Installer unter festem Namen anhängen
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag_name }}"
          BUNDLE=apps/desktop/src-tauri/target/release/bundle

          SETUP=$(find "$BUNDLE/nsis" -name '*-setup.exe' | head -1)
          if [ -z "$SETUP" ]; then
            echo "::error::Kein NSIS-Installer unter $BUNDLE/nsis gefunden."
            exit 1
          fi
          cp "$SETUP" LunaWolvesAgent-Setup.exe
          gh release upload "$TAG" LunaWolvesAgent-Setup.exe --clobber
          echo "LunaWolvesAgent-Setup.exe <- $(basename "$SETUP")"

          MSI=$(find "$BUNDLE/msi" -name '*.msi' | head -1)
          if [ -n "$MSI" ]; then
            cp "$MSI" LunaWolvesAgent.msi
            gh release upload "$TAG" LunaWolvesAgent.msi --clobber
            echo "LunaWolvesAgent.msi <- $(basename "$MSI")"
          fi
