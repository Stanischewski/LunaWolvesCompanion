name: CI

on:
  push:
    branches: [main]
  pull_request:

# Laufende Prüfungen abbrechen, wenn neue Commits kommen.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Lint und Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lunawolves_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/lunawolves_ci
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Abhängigkeiten installieren
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Typprüfung
        run: pnpm run lint

      - name: Tests
        run: pnpm run test

      # Reihenfolge und Vollständigkeit des Journals, ohne Datenbank.
      # drizzle-kit merkt sich beim Anwenden den when-Wert der Migration und
      # wendet später nur noch an, was DARÜBER liegt. Ein Eintrag mit einem
      # when-Wert unter dem bereits erreichten Maximum wird deshalb für immer
      # still übersprungen — kein Fehler, nur eine fehlende Spalte, die erst
      # im Betrieb als HTTP 500 auffällt.
      - name: Journal-Zeitstempel prüfen
        working-directory: apps/api
        run: |
          node -e "
            const j = require('./drizzle/meta/_journal.json');
            const bad = [];
            let prev = null;
            for (const e of j.entries) {
              if (prev !== null && e.when <= prev) bad.push(e.tag + ' (' + e.when + ' <= ' + prev + ')');
              prev = e.when;
            }
            if (bad.length) {
              console.error('::error::when-Werte in drizzle/meta/_journal.json steigen nicht strikt: ' + bad.join(', '));
              process.exit(1);
            }
            console.log(j.entries.length + ' Einträge, strikt monoton steigend.');
          "

      # Mit DEM Werkzeug einspielen, das auch beim Deploy läuft. Eine
      # Shell-Schleife über die SQL-Dateien prüft nur das SQL und übergeht
      # genau die Journal-Auswertung, an der ein Deploy scheitern kann.
      - name: Migrationen einspielen (wie beim Deploy)
        working-directory: apps/api
        run: |
          psql "$DATABASE_URL" -q -c "CREATE ROLE lw_app LOGIN;"
          pnpm db:migrate

      - name: Jede Migration muss verbucht sein
        working-directory: apps/api
        run: |
          expected=$(node -e "console.log(require('./drizzle/meta/_journal.json').entries.length)")
          actual=$(psql "$DATABASE_URL" -tAc 'SELECT count(*) FROM drizzle.__drizzle_migrations')
          echo "Journal: $expected — verbucht: $actual"
          if [ "$expected" != "$actual" ]; then
            echo "::error::drizzle-kit hat $actual von $expected Migrationen angewendet. Das Schema ist unvollständig."
            exit 1
          fi

      - name: Schema gegen Migrationen prüfen
        working-directory: apps/api
        run: |
          # Alle in schema.ts definierten Tabellen müssen nach den Migrationen
          # existieren — sonst fehlt eine Migration.
          missing=$(psql "$DATABASE_URL" -tAc "
            SELECT string_agg(t, ', ') FROM unnest(ARRAY[
              'players','guilds','characters','activity_logs','addon_snapshots',
              'raid_events','raid_signups','character_equipment','item_icon_cache',
              'dkp_entries','dkp_standings','dkp_tombstones','guild_settings','dkp_seasons'
            ]) AS t
            WHERE NOT EXISTS (
              SELECT 1 FROM information_schema.tables
              WHERE table_schema='public' AND table_name=t
            );")
          if [ -n "$missing" ]; then
            echo "::error::Tabellen fehlen nach den Migrationen: $missing"
            exit 1
          fi
          echo "Alle Tabellen vorhanden."

          # Spalten der jüngsten Migrationen. Der Tabellen-Check oben bleibt
          # grün, wenn nur eine Spalte fehlt — genau das war der Fall, als
          # characters.left_guild_at fehlte und der Sync mit 500 abbrach.
          missing_cols=$(psql "$DATABASE_URL" -tAc "
            SELECT string_agg(spec, ', ') FROM unnest(ARRAY[
              'characters.left_guild_at',
              'dkp_seasons.started_at',
              'dkp_seasons.archived_at'
            ]) AS spec
            WHERE NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema='public'
                AND table_name = split_part(spec, '.', 1)
                AND column_name = split_part(spec, '.', 2)
            );")
          if [ -n "$missing_cols" ]; then
            echo "::error::Spalten fehlen nach den Migrationen: $missing_cols"
            exit 1
          fi
          echo "Alle geprüften Spalten vorhanden."

  lua:
    name: Addon-Syntax
    runs-on: ubuntu-latest
    # Das Addon liegt in einem eigenen Repository; dieser Job prüft nur, dass
    # der Lua-Parser die Beispieldateien weiterhin liest.
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @guild/lua-parser run test
